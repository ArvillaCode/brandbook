const raw=[["MASTERCLASS / IDENTIDAD DE MARCA", "CREA EL", "BRANDBOOK", "DE TU NEGOCIO", "De una idea a una marca clara, coherente y reconocible.", "24 OCT 2026", "7 PM  ·  COLOMBIA"], ["PARA EMPEZAR", "¿Tienes un negocio o estás construyendo una marca?", "No es la misma pregunta.", "NEGOCIO", "Ofrece productos o servicios. Puede vender sin tener una identidad definida.", "MARCA", "Tiene propósito, propuesta, personalidad y una experiencia reconocible."], ["UNA DISTINCIÓN IMPRESCINDIBLE", "Tu logo NO es tu marca.", "El logo es una herramienta de identificación. La marca es la percepción que construyes.", "LOGO", "Un signo que permite identificarte.", "IDENTIDAD", "Un sistema de expresión consistente.", "MARCA", "Lo que las personas recuerdan y esperan de ti."], ["CONCEPTOS QUE DEBES DOMINAR", "Tres conceptos. Tres funciones distintas.", "No confundas lo que eres, cómo te expresas y por qué te creen.", "MARCA PERSONAL", "La percepción asociada a una persona: criterio, historia, valores y comportamiento.", "IDENTIDAD VISUAL", "El sistema visible de la marca: logo, colores, tipografías, recursos y aplicaciones.", "AUTORIDAD VISUAL", "La credibilidad que proyecta tu comunicación por consistencia, calidad y evidencia."], ["EL DOCUMENTO MAESTRO", "¿Qué es un brandbook?", "Es la guía que define cómo una marca debe verse, expresarse y mantenerse consistente.", "EVITA LA IMPROVISACIÓN", "Tu equipo deja de inventar colores, piezas y tonos desde cero.", "MULTIPLICA LA COHERENCIA", "Redes sociales, sitio web, propuestas y anuncios transmiten la misma identidad."], ["MAPA DE TRABAJO", "Los 6 pasos de tu brandbook", "Primero se define la estrategia; después se diseña el sistema visual.", "01", "Propósito", "02", "Cliente ideal", "03", "Propuesta de valor", "04", "Personalidad y voz", "05", "Identidad visual", "06", "Aplicaciones y reglas"], ["PASO 01 / FUNDAMENTOS", "Define por qué existe tu negocio.", "Un propósito claro orienta tus decisiones y tu forma de comunicar.", "PREGÚNTATE", "¿Qué problema resolvemos?\n¿Por qué nos importa resolverlo?\n¿Qué cambio queremos provocar?", "FÓRMULA", "Ayudamos a [audiencia] a conseguir [resultado] mediante [solución]."], ["PASO 02 / PÚBLICO OBJETIVO", "No le hables a todo el mundo.", "Cuanto mejor conoces a tu cliente, más precisa se vuelve tu marca.", "SITUACIÓN", "¿Quién es y en qué contexto necesita tu solución?", "DOLOR", "¿Qué problema urgente necesita resolver?", "DECISIÓN", "¿Qué necesita ver y creer para elegirte?"], ["PASO 03 / POSICIONAMIENTO", "Construye una propuesta de valor.", "La pregunta no es qué vendes. Es por qué deberían elegirte.", "Ayudamos a [CLIENTE] a lograr [RESULTADO]", "a través de [MÉTODO / DIFERENCIADOR].", "Evita promesas genéricas como “calidad, compromiso y excelencia”."], ["PASO 04 / PERSONALIDAD", "Si tu marca hablara, ¿cómo sonaría?", "Tu voz es tan identificable como tus colores.", "DEFINE 3 ATRIBUTOS", "Ejemplo: directa, confiable y cercana.\nCada atributo debe traducirse en decisiones concretas.", "ESTABLECE REGLAS", "Qué palabras usas, cuáles evitas, cómo explicas y cómo invitas a actuar."], ["PASO 05 / DISEÑO", "Ahora sí: crea tu identidad visual.", "Una identidad visual funciona como un sistema, no como piezas aisladas.", "Logo", "Versiones, área de protección y usos incorrectos", "Colores", "Paleta principal, secundaria y proporciones", "Tipografía", "Jerarquías y tamaños mínimos", "Recursos", "Iconografía, fotografía, formas y composición"], ["CASO APLICADO / UPFUNNEL", "Así funciona una identidad coherente.", "Ejemplo didáctico con el sistema visual de Upfunnel.", "JET BLACK", "#080C14", "CYAN BLUE", "#00E5FF", "PURE WHITE", "#FFFFFF", "SLATE MIST", "#94A3B8", "Inter Bold / ExtraBold  •  Retícula modular  •  Alto contraste  •  Cian como acento"], ["PASO 06 / IMPLEMENTACIÓN", "Tu identidad debe funcionar en la vida real.", "Un buen brandbook se prueba en puntos de contacto concretos.", "REDES SOCIALES", "Portadas, carruseles, reels, anuncios y comunidad.", "VENTAS", "Propuestas, presentaciones, correos y WhatsApp.", "EXPERIENCIA", "Web, formularios, productos y atención al cliente."], ["ERRORES QUE CUESTAN CONFIANZA", "Cinco errores que debes evitar.", "La coherencia no se consigue publicando más: se consigue decidiendo mejor.", "01", "Cambiar colores y fuentes en cada publicación", "02", "Confundir gusto personal con estrategia", "03", "Copiar la estética de la competencia", "04", "Diseñar sin conocer al cliente", "05", "Crear un PDF que nadie aplica"], ["TALLER EN VIVO / 10 MINUTOS", "Comienza hoy tu propio brandbook.", "Abre un documento y completa estas cinco decisiones iniciales.", "01", "Mi marca existe para...", "02", "Mi cliente ideal necesita...", "03", "Nos eligen porque...", "04", "Nuestra personalidad es...", "05", "Visualmente queremos transmitir..."], ["CIERRE / TU SIGUIENTE PASO", "UNA MARCA SÓLIDA", "NO SE IMPROVISA.", "Se define. Se documenta. Se aplica.", "Tu tarea: completar una primera versión de tu brandbook y usarla en tu próxima publicación.", "Automatiza tus procesos, reduce tu esfuerzo y potencia tus resultados"]];
const icons=['◎','◈','✦','◉','▣','⬡','✺','↗','⚡'];
const character=`<img class="mascot-img" src="assets/instructor.webp" alt="Instructor ilustrado Upfunnel" loading="eager">`;
function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wrap(i,inner){return `<section class="slide" data-slide="${i}" role="group" aria-label="Diapositiva ${i+1}"><header class="topline"><span class="brand"><img class="official-logo" src="assets/upfunnel-logo-oficial.svg" alt="Upfunnel — logotipo oficial" /> <span class="lab-mark">/ BRAND LAB</span></span><span class="index">${String(i+1).padStart(2,'0')} / 16</span></header><div class="content">${inner}</div><footer class="bottom"><span class="line"></span><span>UPFUNNEL · BRAND STRATEGY</span><span>MASTERCLASS 2026</span></footer></section>`}
function head(a){return `<div class="kicker">${e(a[0])}</div><h2 class="title">${e(a[1])}</h2><p class="subtitle">${e(a[2])}</p>`}
function panels(a,start=3,cols=3){let v=a.slice(start), out=[];for(let k=0;k<v.length;k+=2){if(v[k+1]===undefined)break;out.push(`<article class="panel"><div class="num">${icons[out.length%icons.length]}</div><h3>${e(v[k])}</h3><p>${e(v[k+1])}</p></article>`)}return `<div class="panels" style="--cols:${cols}">${out.join('')}</div>`}
function stepPanels(a){return `<div class="panels" style="--cols:3">${[0,1,2,3,4,5].map(k=>`<article class="panel"><div class="num">${e(a[3+k*2])}</div><h3>${e(a[4+k*2])}</h3></article>`).join('')}</div>`}
function build(a,i){if(i===0)return wrap(i,`<div class="hero"><div class="copy"><span class="label">${e(a[0])}</span><h1>CREA EL<br><span class="a">BRANDBOOK</span><br>DE TU NEGOCIO</h1><p class="sub">${e(a[4])}</p><div class="meta">${e(a[5])} &nbsp;·&nbsp; ${e(a[6])}</div></div><div class="character-wrap">${character}</div></div>`);
if(i===5)return wrap(i,head(a)+stepPanels(a));
if(i===8)return wrap(i,head(a)+`<div class="callout">${e(a[3])}<br><span class="formula">${e(a[4])}</span><small>${e(a[5])}</small></div>`);
if(i===11)return wrap(i,head(a)+`<div class="palette">${[3,5,7,9].map((j,k)=>`<div class="swatch ${k===2?'light':''}" style="background:${e(a[j+1])}">${e(a[j])}<small>${e(a[j+1])}</small></div>`).join('')}</div><div class="tip">${e(a[11])}</div>`);
if(i===14)return wrap(i,head(a)+`<div class="work">${[0,1,2,3,4].map(k=>`<div><label>${e(a[3+k*2])} · ${e(a[4+k*2])}<input id="ans${k}" placeholder="Escribe tu respuesta aquí..."></label></div>`).join('')}<button class="save" onclick="saveWork()">↓ Guardar mis respuestas</button></div>`);
if(i===15)return wrap(i,`<div class="kicker">${e(a[0])}</div><div class="finish">UNA MARCA SÓLIDA<br><strong>NO SE IMPROVISA.</strong></div><p class="subtitle">${e(a[3])}</p><div class="callout" style="margin:20px 0;max-width:900px;font-size:clamp(17px,1.7vw,28px)">${e(a[4])}</div><div class="tip">${e(a[5])}</div><div class="mini-ch">${character}</div>`);
if(i===13){let ps=[];for(let k=3;k<a.length;k+=2){ps.push(`<article class="panel"><div class="num">${e(a[k])}</div><h3>${e(a[k+1]||'')}</h3></article>`)}return wrap(i,head(a)+`<div class="panels" style="--cols:3">${ps.join('')}</div>`)}
let cols=(a.length-3)/2>4?4:(a.length-3)/2===2?2:3;return wrap(i,head(a)+panels(a,3,cols))}
document.getElementById('stage').innerHTML=raw.map(build).join('');let current=0;const slides=[...document.querySelectorAll('.slide')];
const notes=['Presenta la promesa: cada negocio merece una marca reconocible.','Pregunta al público por ejemplos de negocios que recuerdan.','Explica por qué el logo es una parte, nunca el todo.','Diferencia identidad y autoridad: percepción y evidencia.','Un brandbook evita decisiones inconsistentes.','Enseña la secuencia: primero estrategia y luego diseño.','Invita a formular un propósito específico y medible.','Cliente ideal no significa excluir a todos los demás.','Pide reemplazar frases genéricas por beneficios concretos.','Demuestra cómo suena una marca directa frente a una formal.','Un sistema visual necesita reglas replicables.','Upfunnel se muestra con su logotipo vectorial maestro Impulso 2.1. No alterar geometría, proporciones ni colores.','La consistencia se comprueba en canales reales.','Invita a detectar los errores frecuentes entre asistentes.','Concede diez minutos y anima a escribir respuestas breves.','Repite la tarea: crear primer borrador y usarlo en una publicación.'];
function render(){document.querySelectorAll('.mascot-img').forEach((im,k)=>{const p=im.closest('.slide');const ind=[...slides].indexOf(p);im.src=ind>=12?'assets/brand-board.webp':ind>=5?'assets/brandbook.webp':'assets/instructor.webp'});slides.forEach((s,i)=>s.classList.toggle('active',i===current));document.getElementById('count').textContent=`${current+1} / ${slides.length}`;document.getElementById('bar').style.width=`${(current+1)*100/slides.length}%`;document.getElementById('notesBox').textContent=notes[current];location.hash=`slide-${current+1}`}
function move(n){current=Math.max(0,Math.min(slides.length-1,current+n));render()};function full(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else document.exitFullscreen?.()};function toggleNotes(){document.getElementById('notesBox').classList.toggle('open')}
function saveWork(){let vals=[0,1,2,3,4].map(i=>document.getElementById('ans'+i).value);let text='MIS PRIMERAS DECISIONES DE MARCA — UPFUNNEL\n\n'+['Mi marca existe para','Mi cliente ideal necesita','Nos eligen porque','Nuestra personalidad es','Visualmente queremos transmitir'].map((x,i)=>x+': '+vals[i]).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='mi-brandbook-inicial.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('keydown',ev=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(ev.key)){ev.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();move(-1)}else if(ev.key.toLowerCase()==='f')full();else if(ev.key.toLowerCase()==='n')toggleNotes();else if(ev.key.toLowerCase()==='p')window.print()});let x0=null;document.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(x0===null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>75)move(dx<0?1:-1);x0=null},{passive:true});let n=Number((location.hash.match(/slide-(\d+)/)||[])[1]||1);current=Math.max(0,Math.min(15,n-1));render();
